<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown Reader &amp; Editor</title>
<script src="marked.min.js"></script>
<style>
  :root {
    --bg: #faf9f7;
    --panel: #ffffff;
    --border: #e4e0da;
    --text: #2b2823;
    --muted: #7a7368;
    --accent: #b45f2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 32px 60px;
  }
  h1 {
    font-size: 1.4em;
    margin: 0 0 20px;
  }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85em;
    background: var(--panel);
    transition: border-color 0.15s, background 0.15s;
  }
  #dropzone.drag {
    border-color: var(--accent);
    background: #fdf3ec;
  }
  #filename {
    margin-top: 10px;
    font-size: 0.9em;
    color: var(--muted);
  }
  #output {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 28px;
    line-height: 1.7;
    overflow-wrap: break-word;
    overflow-y: auto;
  }
  #output h1, #output h2, #output h3 { line-height: 1.3; }
  #output pre {
    background: #f4f1ec;
    padding: 12px 16px;
    border-radius: 6px;
    overflow-x: auto;
  }
  #output code {
    background: #f4f1ec;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  #output pre code { background: none; padding: 0; }
  #output blockquote {
    border-left: 3px solid var(--accent);
    margin: 0;
    padding-left: 16px;
    color: var(--muted);
  }
  #output table {
    border-collapse: collapse;
    width: 100%;
  }
  #output th, #output td {
    border: 1px solid var(--border);
    padding: 6px 10px;
  }
  #output img { max-width: 100%; }
  #error {
    color: #b03030;
    margin-top: 12px;
    font-size: 0.9em;
    display: none;
  }
  #textInput {
    width: 100%;
    padding: 20px 24px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95em;
    line-height: 1.7;
    tab-size: 2;
    resize: none;
    overflow-y: auto;
  }
  #textInput:focus {
    outline: none;
    border-color: var(--accent);
  }
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 0.9em;
  }
  .btn.secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  #savedName {
    font-size: 0.85em;
    color: var(--muted);
  }
  .editor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: stretch;
    height: 72vh;
    min-height: 420px;
  }
  .editor.preview-only #textInput { display: none; }
  .editor.preview-only { grid-template-columns: 1fr; }
  .editor.edit-only #output { display: none; }
  .editor.edit-only { grid-template-columns: 1fr; }
  .pane-label {
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane #textInput, .pane #output { flex: 1; min-height: 0; }
  @media (max-width: 640px) {
    .editor { grid-template-columns: 1fr; height: auto; }
    .pane #textInput { min-height: 240px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Markdown Reader &amp; Editor</h1>

  <div class="toolbar">
    <button class="btn secondary" id="openBtn">Open .md</button>
    <button class="btn secondary" id="viewToggle" data-mode="split">View: Split</button>
    <span class="spacer"></span>
    <span id="savedName"></span>
    <button class="btn" id="downloadBtn">Download .md</button>
    <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain" hidden>
  </div>

  <div id="dropzone">
    Drop a .md file here to edit it
    <div id="filename"></div>
  </div>

  <div id="error"></div>

  <div class="editor" id="editor">
    <div class="pane">
      <div class="pane-label">Markdown</div>
      <textarea id="textInput" placeholder="Type or paste your markdown here..."></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">Preview</div>
      <div id="output"></div>
    </div>
  </div>
</div>

<script src="app.1.js"></script>
</body>
</html>
